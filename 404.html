<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>404 — Page Not Found | Adhika Dwiki Septian</title>
  <link rel="icon" type="image/svg+xml" href="/web-portofolio/favicon.svg" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #050505;
      color: #e4e4e7;
      font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
    }
    .card {
      width: min(560px, 100%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      background: #0d0d0d;
      padding: clamp(24px, 6vw, 48px);
      text-align: center;
    }
    .code {
      font-family: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
      font-size: clamp(4rem, 18vw, 7rem);
      font-weight: 700;
      line-height: 1;
      color: #facc15;
      letter-spacing: -0.05em;
      margin: 0;
    }
    h1 { font-size: 1.35rem; margin: 16px 0 8px; }
    p { color: #a1a1aa; line-height: 1.6; margin: 0 0 24px; }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 12px 22px;
      border-radius: 999px;
      background: #facc15;
      color: #050505;
      font-weight: 600;
      text-decoration: none;
    }
    a:hover { background: #fde047; }
    a:focus-visible { outline: 2px solid #fafafa; outline-offset: 3px; }
  </style>
</head>
<body>
  <main class="card">
    <p class="code">404</p>
    <h1>Page not found</h1>
    <p>The page you are looking for doesn't exist or has been moved.</p>
    <a href="/web-portofolio/">Back to portfolio</a>
  </main>
</body>
</html>
